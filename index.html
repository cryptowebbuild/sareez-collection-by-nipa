                  "নিপা আপুর লাইভ দেখে কাঞ্জিভরম শাড়ি অর্ডার করেছিলাম। মাত্র ২ দিনে পার্সেল হাতে পেয়েছি। ফেব্রিক্সের সফটনেস এবং কালার একদম শতভাগ খাঁটি ছিল।"
                </p>
                <div className="pt-2 border-t border-boutique-500/10 flex items-center justify-between text-xs">
                  <span className="font-bold text-white">সামিয়া রহমান</span>
                  <span className="text-roseGold-400/70">উত্তরা, ঢাকা</span>
                </div>
              </div>

              <div className="p-5 rounded-xl bg-boutique-950/80 border border-boutique-500/20 space-y-3 shadow-md">
                <div className="flex text-gold-400 text-sm">★★★★★</div>
                <p className="text-xs sm:text-sm text-roseGold-100/90 italic">
                  "বিয়ের অনুষ্ঠানের জন্য সফট কাতান নিয়েছিলাম। শাড়িটির ওজন একদমই হালকা কিন্তু লুকটা দারুণ আভিজাত্যময়। নিপা’স কালেকশন সত্যিই সেরা।"
                </p>
                <div className="pt-2 border-t border-boutique-500/10 flex items-center justify-between text-xs">
                  <span className="font-bold text-white">তানিয়া ইসলাম</span>
                  <span className="text-roseGold-400/70">চট্টগ্রাম</span>
                </div>
              </div>

            </div>
          </section>

          {/* 7. FOOTER */}
          <footer className="mt-auto bg-boutique-950 border-t border-boutique-500/30 pt-12 pb-24 md:pb-12 text-xs sm:text-sm text-roseGold-300/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
              
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div className="space-y-3 md:col-span-2">
                  <div className="flex items-center gap-2">
                    <span className="w-8 h-8 rounded-full bg-boutique-800 border border-roseGold-400 flex items-center justify-center font-serif font-black text-gold-300 text-lg">নি</span>
                    <span className="font-serif font-bold text-lg text-white">Sareez Collection by Nipa</span>
                  </div>
                  <p className="text-xs text-roseGold-300/70 max-w-md">
                    ধানমন্ডির স্বনামধন্য এক্সক্লুসিভ ও পিওর হ্যান্ডলুম শাড়ির ব্র্যান্ড। ইম্পেরিয়াল জাস্টিস আমিন আহমেদ সেন্টার, ধানমন্ডি ১০/এ।
                  </p>
                  <div className="flex items-center gap-3 pt-2">
                    <a href={FB_LINK} target="_blank" rel="noopener noreferrer" className="p-2 rounded bg-boutique-900 border border-boutique-500/30 hover:border-gold-400 text-roseGold-300">
                      ফেসবুক পেজ (২২৫কে ফলোয়ার্স)
                    </a>
                  </div>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-gold-400">দ্রুত লিংক</p>
                  <ul className="space-y-1.5 text-xs">
                    <li><a href="#collection" className="hover:text-gold-300">সকল শাড়ি কালেকশন</a></li>
                    <li><a href="#showroom" className="hover:text-gold-300">ধানমন্ডি শোরুম</a></li>
                    <li><a href={`tel:${BRAND_PHONE}`} className="hover:text-gold-300">সরাসরি কল করুন</a></li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-gold-400">কনসেপ্ট ডেমো ক্রেডিট</p>
                  <p className="text-xs leading-relaxed text-roseGold-300/70">
                    এটি একটি প্রিমিয়াম বুটিক ই-কমার্স ওয়েব কনসেপ্ট ডেমো। ডিজাইন ও ডেভেলপ করেছে <a href="https://cryptowebbuild.com" target="_blank" rel="noopener noreferrer" className="text-gold-300 font-bold underline">CryptoWebBuild</a>।
                  </p>
                </div>
              </div>

              <div className="pt-6 border-t border-boutique-500/20 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-xs">
                <p>© ২০২৬ Sareez Collection by Nipa. সর্বস্বত্ব সংরক্ষিত।</p>
                <p className="text-gold-400 font-medium">
                  Designed with ❤️ for Pure Handloom & Silk Lovers
                </p>
              </div>

            </div>
          </footer>

          {/* 8. ORDER / WHATSAPP DRAWER MODAL */}
          {orderModalProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div 
                className="bg-boutique-950 border border-boutique-400/60 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative text-roseGold-50"
                onClick={(e) => e.stopPropagation()}
              >
                
                {/* Close Button */}
                <button 
                  onClick={() => setOrderModalProduct(null)}
                  className="absolute top-4 right-4 text-roseGold-300 hover:text-white p-1 rounded-full bg-boutique-900 border border-boutique-500/20"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>

                <div className="flex items-center gap-3 mb-4 pb-3 border-b border-boutique-500/20">
                  <img 
                    src={orderModalProduct.image} 
                    alt={orderModalProduct.title} 
                    className="w-16 h-16 rounded-xl object-cover border border-boutique-500/40"
                  />
                  <div>
                    <span className="text-[10px] text-gold-400 font-mono font-bold uppercase">{orderModalProduct.code}</span>
                    <h3 className="text-sm sm:text-base font-bold text-white line-clamp-1">{orderModalProduct.title}</h3>
                    <p className="text-sm font-extrabold text-gold-300">
                      ৳{orderModalProduct.price.toLocaleString('en-IN')}
                    </p>
                  </div>
                </div>

                <form onSubmit={handleWhatsAppSubmit} className="space-y-4 text-xs sm:text-sm">
                  
                  {/* Quantity selector */}
                  <div className="flex items-center justify-between bg-boutique-900/60 p-2.5 rounded-xl border border-boutique-500/20">
                    <span className="font-semibold text-roseGold-200">শাড়ির সংখ্যা (পিস):</span>
                    <div className="flex items-center gap-3">
                      <button 
                        type="button"
                        onClick={() => setQuantity(Math.max(1, quantity - 1))}
                        className="w-7 h-7 rounded bg-boutique-800 text-gold-300 font-bold border border-boutique-500/30 flex items-center justify-center hover:bg-boutique-700"
                      >-</button>
                      <span className="font-bold text-base text-white">{quantity}</span>
                      <button 
                        type="button"
                        onClick={() => setQuantity(quantity + 1)}
                        className="w-7 h-7 rounded bg-boutique-800 text-gold-300 font-bold border border-boutique-500/30 flex items-center justify-center hover:bg-boutique-700"
                      >+</button>
                    </div>
                  </div>

                  {/* Delivery Mode Choice */}
                  <div className="space-y-1.5">
                    <label className="block text-xs font-bold text-gold-300">ডেলিভারি / রিসিভ অপশন:</label>
                    <div className="grid grid-cols-1 gap-2">
                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'dhaka' ? 'border-boutique-400 bg-boutique-900/80 text-white font-bold' : 'border-boutique-500/20 bg-boutique-950 text-roseGold-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="dhaka" 
                            checked={deliveryOption === 'dhaka'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-boutique-500"
                          />
                          <span>ঢাকা সিটির ভেতরে হোম ডেলিভারি</span>
                        </div>
                        <span className="text-gold-300 font-mono">৳৭০</span>
                      </label>

                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'outside' ? 'border-boutique-400 bg-boutique-900/80 text-white font-bold' : 'border-boutique-500/20 bg-boutique-950 text-roseGold-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="outside" 
                            checked={deliveryOption === 'outside'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-boutique-500"
                          />
                          <span>ঢাকার বাইরে সুন্দরবন / এসএ পরিবহন</span>
                        </div>
                        <span className="text-gold-300 font-mono">৳১৩০</span>
                      </label>

                      <label className={`flex items-center justify-between p-2.5 rounded-xl border cursor-pointer text-xs ${deliveryOption === 'pickup' ? 'border-boutique-400 bg-boutique-900/80 text-white font-bold' : 'border-boutique-500/20 bg-boutique-950 text-roseGold-200'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" 
                            name="delivery" 
                            value="pickup" 
                            checked={deliveryOption === 'pickup'} 
                            onChange={(e) => setDeliveryOption(e.target.value)}
                            className="accent-boutique-500"
                          />
                          <span>ধানমন্ডি শোরুম পিকআপ (প্লট ৫৪, রোড ১০/এ)</span>
                        </div>
                        <span className="text-emerald-400 font-bold">ফ্রি (৳০)</span>
                      </label>
                    </div>
                  </div>

                  {/* Customer Inputs */}
                  <div className="space-y-2">
                    <div>
                      <label className="block text-xs font-bold text-roseGold-200 mb-1">আপনার নাম *</label>
                      <input 
                        type="text" 
                        required
                        placeholder="আপনার সম্পূর্ণ নাম লিখুন"
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        className="w-full bg-boutique-900 border border-boutique-500/30 rounded-lg px-3 py-2 text-white placeholder-roseGold-300/40 text-xs sm:text-sm focus:outline-none focus:border-boutique-400"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-roseGold-200 mb-1">মোবাইল নম্বর *</label>
                      <input 
                        type="tel" 
                        required
                        placeholder="০১XXXXXXXXX"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        className="w-full bg-boutique-900 border border-boutique-500/30 rounded-lg px-3 py-2 text-white placeholder-roseGold-300/40 text-xs sm:text-sm focus:outline-none focus:border-boutique-400"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-roseGold-200 mb-1">
                        {deliveryOption === 'pickup' ? 'শোরুমে আসার সম্ভাব্য দিন/সময়' : 'ডেলিভারি ঠিকানা *'}
                      </label>
                      <textarea 
                        rows="2"
                        placeholder={deliveryOption === 'pickup' ? 'কখন শোরুমে আসবেন লিখুন' : 'বাসা নং, রোড, থানা, জেলা'}
                        value={customerAddress}
                        onChange={(e) => setCustomerAddress(e.target.value)}
                        className="w-full bg-boutique-900 border border-boutique-500/30 rounded-lg px-3 py-2 text-white placeholder-roseGold-300/40 text-xs sm:text-sm focus:outline-none focus:border-boutique-400"
                      ></textarea>
                    </div>
                  </div>

                  {/* Total Calculation */}
                  <div className="bg-boutique-900/80 rounded-xl p-3 border border-boutique-400/40 space-y-1 text-xs">
                    <div className="flex justify-between text-roseGold-300">
                      <span>শাড়ির সাবটোটাল:</span>
                      <span>৳{(orderModalProduct.price * quantity).toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-roseGold-300">
                      <span>ডেলিভারি চার্জ:</span>
                      <span>{deliveryCost === 0 ? 'ফ্রি' : `৳${deliveryCost}`}</span>
                    </div>
                    <div className="flex justify-between text-base font-extrabold text-gold-300 pt-1 border-t border-boutique-500/20">
                      <span>সর্বমোট প্রদেয়:</span>
                      <span>৳{grandTotal.toLocaleString('en-IN')}</span>
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button 
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2"
                  >
                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                    </svg>
                    <span>১-ক্লিকে হোয়াটসঅ্যাপে বুকিং সম্পন্ন করুন</span>
                  </button>

                  <p className="text-[10px] text-center text-roseGold-300/60">
                    * আপনার দেওয়া তথ্য নিয়ে সরাসরি নিপা’স কালেকশনের হোয়াটসঅ্যাপ ওপেন হবে।
                  </p>

                </form>

              </div>
            </div>
          )}

          {/* 9. HIGH RESOLUTION IMAGE ZOOM LIGHTBOX */}
          {zoomImage && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fade-in"
              onClick={() => setZoomImage(null)}
            >
              <div className="relative max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl border border-boutique-500/40 bg-boutique-950">
                <button 
                  onClick={() => setZoomImage(null)}
                  className="absolute top-4 right-4 text-white p-2 rounded-full bg-boutique-950/80 border border-boutique-500/30 hover:bg-boutique-500 transition z-10"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
                <img 
                  src={zoomImage} 
                  alt="Sareez Collection by Nipa - এক্সক্লুসিভ শাড়ি ভিউ" 
                  className="w-full h-auto max-h-[85vh] object-contain"
                />
              </div>
            </div>
          )}

          {/* 10. MOBILE BOTTOM FLOATING ACTION BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-boutique-950/95 backdrop-blur-md border-t border-boutique-500/30 p-2.5 flex items-center gap-2">
            <a 
              href={`tel:${BRAND_PHONE}`}
              className="flex-1 py-2.5 rounded-xl bg-boutique-900 border border-boutique-500/40 text-gold-300 font-bold text-xs flex items-center justify-center gap-1.5"
            >
              <svg className="w-4 h-4 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>হটলাইনে কল</span>
            </a>

            <a 
              href={`https://wa.me/${WHATSAPP_NUM}`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md"
            >
              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
              </svg>
              <span>হোয়াটসঅ্যাপ চ্যাট</span>
            </a>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
